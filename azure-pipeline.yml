trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'sc-azure-acr-devops-demo'
  imageRepository: 'azure-demo'
  containerRegistry: 'azuredevopsdemo.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'


stages:
  - stage: Build
    displayName: 'Build Application'
    jobs:
      - job: InstallDependencies
        displayName: 'Install Python Dependencies'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
            displayName: 'Use Python 3.12'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install Dependencies'

  - stage: Test
    displayName: 'Test Application'
    dependsOn: Build
    jobs:
      - job: RunTests
        displayName: 'Run Pytest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - script: |
              python -m pip install -r requirements.txt
              pip install pytest
              pytest tests/ --junitxml=test-results.xml
            displayName: 'Run Unit Tests'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results.xml'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()
            displayName: 'Publish Test Results'

  - stage: PublishImage
    displayName: 'Build and Publish Docker Image'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: DockerBuildAndPush
        displayName: Publish Image to ACR
        steps:
          - task: Docker@2
            displayName: Build and Push Image
            inputs:
              command: buildAndPush
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: 'Deployment Validation'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: ValidateDeployment
        displayName: 'Validate Application'
        steps:
          - script: |
              echo "Deployment validation started."
              echo "Application files are available."
              echo "Deployment validation completed."
            displayName: 'Validate Deployment'
